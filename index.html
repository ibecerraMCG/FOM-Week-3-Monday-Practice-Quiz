<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Monday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e; /* Dark background */
            --container-bg: #3c424f; /* Slightly lighter container */
            --text-color: #e8e6e3; /* Light text */
            --question-text-color: #8ab4f8; /* Light blue for questions */
            --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
            --border-color: #555; /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
             transition: background-color 0.3s, color 0.3s;
        }
         #theme-toggle-button:hover {
             opacity: 0.8;
         }


        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }
        
        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
             font-weight: bold;
             color: var(--question-text-color);
        }
        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

         .check-button:disabled {
             background-color: var(--button-disabled-bg);
             cursor: not-allowed;
             opacity: 0.7;
         }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
             font-weight: bold;
             font-size: 1.1em;
             display: block;
             margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <button id="theme-toggle-button">Toggle Theme</button>
    <h1>Week 3 Monday Practice Quiz</h1>

    <div id="quiz-container">
        <!-- Questions will be loaded here by JavaScript -->
    </div>

    <script>
        const quizData = [
    {
        learningObjective: "LO1 (Bioenergetics): Explain the term 'Bioenergetics' and basic principles governing catabolism and anabolism.",
        question: "A medical student observes the synthesis of triglycerides from fatty acids and glycerol for storage in adipose tissue in a well-fed individual. Which of the following best describes this metabolic process in terms of bioenergetics?",
        options: { 
            A: "Catabolic and exergonic", 
            B: "Anabolic and exergonic", 
            C: "Catabolic and endergonic", 
            D: "Anabolic and endergonic" 
        },
        correctAnswer: "D",
        rationale: "The synthesis of complex molecules (triglycerides) from simpler ones (fatty acids, glycerol) is an anabolic process. Anabolic reactions require an input of energy to proceed, making them endergonic (having a positive ΔG). Catabolic reactions, in contrast, break down complex molecules and release energy (exergonic).",
        source: "'Endergonic reactions: ΔG⁰ is positive, anabolic reactions.' (Bioenergetics, Page 5) and 'Anabolic reactions transfer energy from ATP to complex molecules.' (Bioenergetics, Page 6)"
    },
    {
        learningObjective: "LO1 (Bioenergetics): Explain the term 'Bioenergetics' and basic principles governing catabolism and anabolism.",
        question: "During a marathon, a runner's muscle cells break down glycogen into glucose, which is then oxidized to produce ATP. This breakdown of a complex carbohydrate into simpler molecules to release energy is an example of what type of reaction?",
        options: { 
            A: "Anabolic", 
            B: "Catabolic", 
            C: "Isomerization", 
            D: "Reduction" 
        },
        correctAnswer: "B",
        rationale: "Catabolism is the set of metabolic pathways that breaks down complex molecules into simpler units to release energy. The breakdown of glycogen for energy production is a classic example of a catabolic process. Anabolism is the synthesis of complex molecules, which requires energy.",
        source: "'Catabolic reactions transfer energy from complex molecules to ATP.' (Bioenergetics, Page 6)"
    },
    {
        learningObjective: "LO1 (Bioenergetics): Explain the term 'Bioenergetics' and basic principles governing catabolism and anabolism.",
        question: "In a cell, the energy required for the synthesis of protein from amino acids (an endergonic process) is typically supplied directly by the hydrolysis of which of the following molecules?",
        options: { 
            A: "ATP", 
            B: "NADH", 
            C: "FADH2", 
            D: "Glucose" 
        },
        correctAnswer: "A",
        rationale: "Endergonic (anabolic) reactions are driven by coupling them with exergonic (catabolic) reactions. The hydrolysis of ATP to ADP and inorganic phosphate (Pi) is a highly exergonic reaction that releases a significant amount of free energy. This energy is harnessed by the cell to power numerous endergonic processes, including protein synthesis.",
        source: "'A working muscle recycles over 10 million ATPs per second.' (Bioenergetics, Page 10) This illustrates the central role of ATP as the immediate energy currency for coupling reactions."
    },
    {
        learningObjective: "LO2 (Bioenergetics): Explain the link between the major catabolic pathways, TCA cycle, and electron transport chain to ATP synthesis in the mitochondria.",
        question: "A 45-year-old man with a rare genetic disorder has a defect in the pyruvate dehydrogenase complex. This defect would most directly impair the entry of metabolites derived from which of the following pathways into the TCA cycle?",
        options: { 
            A: "Glycolysis", 
            B: "Beta-oxidation of fatty acids", 
            C: "Ketone body utilization", 
            D: "Amino acid catabolism" 
        },
        correctAnswer: "A",
        rationale: "Glycolysis breaks down glucose into pyruvate in the cytoplasm. Pyruvate is then transported into the mitochondria and converted to acetyl-CoA by the pyruvate dehydrogenase complex. This acetyl-CoA is the primary entry point for carbohydrate-derived carbons into the TCA cycle. Beta-oxidation and catabolism of certain amino acids produce acetyl-CoA directly, bypassing this step.",
        source: "'Glucose --> Pyruvate --> Acetyl CoA --> CITRIC ACID CYCLE.' (Bioenergetics, Page 8)"
    },
    {
        learningObjective: "LO2 (Bioenergetics): Explain the link between the major catabolic pathways, TCA cycle, and electron transport chain to ATP synthesis in the mitochondria.",
        question: "The catabolism of carbohydrates, fats, and proteins ultimately converges on the TCA cycle through the production of acetyl-CoA. The primary function of the TCA cycle in energy production is to generate which of the following products for the electron transport chain?",
        options: { 
            A: "ATP and GTP", 
            B: "Lactate and pyruvate", 
            C: "NADH and FADH2", 
            D: "Carbon dioxide and water" 
        },
        correctAnswer: "C",
        rationale: "While the TCA cycle produces one molecule of GTP (or ATP) per turn via substrate-level phosphorylation, its main energetic contribution is the reduction of NAD+ and FAD to NADH and FADH2. These reduced electron carriers donate their high-energy electrons to the electron transport chain, which drives the bulk of ATP synthesis through oxidative phosphorylation.",
        source: "'Energy production... TCA cycle [produces] 3 NADH, FADH2.' (Bioenergetics, Page 9)"
    },
    {
        learningObjective: "LO2 (Bioenergetics): Explain the link between the major catabolic pathways, TCA cycle, and electron transport chain to ATP synthesis in the mitochondria.",
        question: "A patient ingests cyanide, a poison that specifically inhibits Complex IV (cytochrome c oxidase) of the electron transport chain. What is the most immediate consequence of this inhibition on mitochondrial processes?",
        options: { 
            A: "Increased ATP synthesis via ATP synthase", 
            B: "Increased consumption of molecular oxygen", 
            C: "Accumulation of reduced NADH and FADH2", 
            D: "Accelerated rate of the TCA cycle" 
        },
        correctAnswer: "C",
        rationale: "The electron transport chain (ETC) functions to re-oxidize NADH and FADH2 by transferring their electrons sequentially to the final electron acceptor, oxygen. If Complex IV, the final complex, is blocked, electrons cannot be transferred to oxygen. This causes a 'backup' in the chain, leading to an accumulation of reduced carriers (NADH and FADH2) because they cannot be re-oxidized. This buildup of reduced carriers, in turn, inhibits the TCA cycle.",
        source: "'Electrons from NADH and FADH2 flow through and transfer to the final acceptor, oxygen.' (Bioenergetics, Page 13) and the diagram on Page 14 shows the flow of electrons through the complexes, with Cyanide (a Complex IV inhibitor) blocking the final step."
    },
    {
        learningObjective: "LO3 (Bioenergetics): Explain how the energy status in a cell is sensed and explain the significance of AMP, high energy phosphates, and adenylate kinase in cellular energy homeostasis.",
        question: "In a cell with high energy demand and rapid ATP consumption, the enzyme adenylate kinase becomes highly active. What is the primary role of this enzyme in sensing and responding to the cell's energy status?",
        options: { 
            A: "It directly synthesizes ATP from glucose.", 
            B: "It generates AMP from two molecules of ADP, amplifying the low-energy signal.", 
            C: "It breaks down creatine phosphate to regenerate ATP.", 
            D: "It phosphorylates glucose to trap it in the cell." 
        },
        correctAnswer: "B",
        rationale: "Adenylate kinase catalyzes the reversible reaction 2 ADP ↔ ATP + AMP. When ATP is consumed, ADP levels rise. Adenylate kinase converts this ADP into ATP (for immediate use) and AMP. The resulting increase in AMP concentration is a much more sensitive indicator of low energy status than the decrease in ATP itself. AMP then acts as a potent allosteric activator for key catabolic enzymes, such as phosphofructokinase-1 in glycolysis.",
        source: "'Adenylate kinase catalyzes the interconversion of adenine dinucleotides: 2ADP ↔ AMP +ATP.' (Bioenergetics, Page 17) and the diagram on page 18 shows AK generating AMP, which signals to AMP-sensors like AMPK."
    },
    {
        learningObjective: "LO3 (Bioenergetics): Explain how the energy status in a cell is sensed and explain the significance of AMP, high energy phosphates, and adenylate kinase in cellular energy homeostasis.",
        question: "During a short, maximal-effort sprint, a skeletal muscle cell rapidly depletes its ATP stores. Which of the following high-energy phosphate compounds is used to quickly regenerate ATP from ADP before glycolysis and oxidative phosphorylation can increase their rates?",
        options: { 
            A: "Phosphoenolpyruvate", 
            B: "1,3-Bisphosphoglycerate", 
            C: "Creatine phosphate", 
            D: "Glucose-6-phosphate" 
        },
        correctAnswer: "C",
        rationale: "Creatine phosphate (phosphocreatine) serves as a ready reservoir of high-energy phosphate groups in tissues with high, fluctuating energy demands like skeletal muscle and brain. The enzyme creatine kinase catalyzes the transfer of a phosphate group from creatine phosphate to ADP, rapidly regenerating ATP. This process, called transphosphorylation, buffers ATP levels during the first few seconds of intense activity.",
        source: "'Phosphocreatine (PCr)/Creatine phosphate serves as a ready source of energy for quick synthesis of ATP from ADP by transphosphorylation.' (Bioenergetics, Page 20)"
    },
    {
        learningObjective: "LO3 (Bioenergetics): Explain how the energy status in a cell is sensed and explain the significance of AMP, high energy phosphates, and adenylate kinase in cellular energy homeostasis.",
        question: "The 'adenylate energy charge' is an index used to measure the energy stored in a cell. A high energy charge (approximately 0.9) indicates a state where ATP levels are high, and ADP/AMP levels are low. In such a state, which of the following metabolic pathways would be predominantly active?",
        options: { 
            A: "ATP-generating (catabolic) pathways", 
            B: "ATP-utilizing (anabolic) pathways", 
            C: "Both catabolic and anabolic pathways at maximal rates", 
            D: "Neither pathway would be active" 
        },
        correctAnswer: "B",
        rationale: "A high adenylate charge signifies an energy-rich state. This signals the cell that there is sufficient energy available for biosynthetic processes. Therefore, ATP-utilizing (anabolic) pathways, such as the synthesis of glycogen, proteins, and fats, will be active. Conversely, ATP-generating (catabolic) pathways will be inhibited to prevent wasteful overproduction of energy.",
        source: "The graph on page 17 of Bioenergetics shows that at a high energy charge (0.85-0.88), the rate of the U (ATP-utilizing/anabolic) curve is high, while the rate of the R (ATP-generating/catabolic) curve is low."
    },
    {
        learningObjective: "LO4 (Bioenergetics): Describe that the respiratory quotient permits estimation of the mix of metabolic fuels being oxidized and measure the respiratory quotient in a given scenario.",
        question: "A researcher measures the oxygen consumption and carbon dioxide production of a subject at rest who has been fasting overnight. The calculated respiratory quotient (RQ) is 0.71. This value suggests that the subject's cells are predominantly metabolizing which class of macronutrient for energy?",
        options: { 
            A: "Carbohydrates", 
            B: "Proteins", 
            C: "Fats", 
            D: "A mix of carbohydrates and fats" 
        },
        correctAnswer: "C",
        rationale: "The respiratory quotient (RQ) is the ratio of CO2 produced to O2 consumed (RQ = V̇CO2 / V̇O2). The RQ for pure fat oxidation is approximately 0.7, for pure carbohydrate oxidation is 1.0, and for pure protein oxidation is about 0.82. An RQ of 0.71 is very close to 0.7, indicating that fat is the primary fuel source, which is expected in a fasting state.",
        source: "'SUBTRATE: Fat, RQ: .7' (Bioenergetics, Page 24)"
    },
    {
        learningObjective: "LO4 (Bioenergetics): Describe that the respiratory quotient permits estimation of the mix of metabolic fuels being oxidized and measure the respiratory quotient in a given scenario.",
        question: "Immediately following a large meal rich in pasta and bread, a healthy individual's respiratory quotient (RQ) is measured. The RQ value would be expected to be closest to which of the following?",
        options: { 
            A: "0.7", 
            B: "0.85", 
            C: "1.0", 
            D: "1.2" 
        },
        correctAnswer: "C",
        rationale: "A meal rich in pasta and bread consists primarily of carbohydrates. When carbohydrates are the main fuel source being oxidized, the ratio of CO2 produced to O2 consumed is 1.0, based on the chemical equation for glucose oxidation (C6H12O6 + 6O2 → 6CO2 + 6H2O). Therefore, the RQ would approach 1.0.",
        source: "'The equation for aerobic respiration of a hexose sugar(carb): C6H12O6 + 6O2 = 6CO2 + 6H2O. R.Q. = 6CO2/6O2 = 1.' (Bioenergetics, Page 24)"
    },
    {
        learningObjective: "LO4 (Bioenergetics): Describe that the respiratory quotient permits estimation of the mix of metabolic fuels being oxidized and measure the respiratory quotient in a given scenario.",
        question: "A patient with uncontrolled type 1 diabetes is in a state of ketoacidosis. Their body is unable to effectively use glucose and is instead relying heavily on the beta-oxidation of fatty acids for energy. During indirect calorimetry, their respiratory quotient (RQ) is measured. The expected RQ would be:",
        options: { 
            A: "Approximately 1.0, indicating carbohydrate use", 
            B: "Approximately 0.7, indicating fatty acid use", 
            C: "Greater than 1.0, indicating lipogenesis", 
            D: "Approximately 0.85, indicating mixed fuel use" 
        },
        correctAnswer: "B",
        rationale: "In uncontrolled type 1 diabetes, lack of insulin prevents glucose uptake and utilization by many tissues. The body compensates by breaking down fats into fatty acids and ketone bodies for energy. This metabolic state is characterized by a heavy reliance on fat oxidation. The RQ for fat oxidation is approximately 0.7.",
        source: "The table on page 24 of Bioenergetics clearly states that the RQ for fat metabolism is 0.7. The scenario describes a state of exclusive fat metabolism."
    },
    {
        learningObjective: "LO5 (Bioenergetics): Describe how internal and external mechanisms shift cells from catabolic to anabolic states.",
        question: "After a large, carbohydrate-rich meal, rising blood glucose levels trigger the release of insulin. The internal cellular environment shifts to an anabolic state. Which of the following internal factors is a key mediator that promotes the synthesis of fatty acids in the liver under these conditions?",
        options: { 
            A: "High levels of AMP", 
            B: "High levels of mitochondrial citrate exported to the cytosol", 
            C: "Low levels of NADH", 
            D: "High levels of glucagon" 
        },
        correctAnswer: "B",
        rationale: "In a fed state, glycolysis and the TCA cycle are highly active, leading to an abundance of citrate in the mitochondria. This excess citrate is exported to the cytosol, where it serves two main anabolic functions: it is cleaved by ATP citrate lyase to provide acetyl-CoA (the building block for fatty acid synthesis) and it allosterically activates acetyl-CoA carboxylase, the rate-limiting enzyme of fatty acid synthesis.",
        source: "'Exchanges a citrate made in mitochondrial matrix during the TCA cycle for a malate to convert back to Acetyl CoA (by ATP citrate lyase) for fatty acid synthesis in cytosol/cytoplasm of cell.' (Bioenergetics, Page 29)"
    },
    {
        learningObjective: "LO5 (Bioenergetics): Describe how internal and external mechanisms shift cells from catabolic to anabolic states.",
        question: "During prolonged fasting, the body enters a catabolic state to maintain blood glucose levels. Which of the following represents a key external mechanism and a corresponding internal hormonal signal that promotes this shift?",
        options: { 
            A: "External: Fed state; Internal: High insulin", 
            B: "External: Sedentary lifestyle; Internal: High leptin", 
            C: "External: Fasting; Internal: High glucagon", 
            D: "External: Growth; Internal: Low thyroid hormone" 
        },
        correctAnswer: "C",
        rationale: "Fasting is an external condition that necessitates a shift to catabolism to release stored energy. The primary internal hormonal signal for this state is an increase in glucagon and a decrease in insulin. Glucagon acts on the liver to stimulate glycogenolysis and gluconeogenesis, releasing glucose into the blood.",
        source: "'External Mechanisms [include] Fed state... Internal [factors include] Secreted factors (cytokines, growth factors, hormones).' (Bioenergetics, Page 25). The hormonal control diagrams on the Clinical Significance PDF (page 18) show that glucagon is released when 'the glucose in the blood is low' (fasting state)."
    },
    {
        learningObjective: "LO5 (Bioenergetics): Describe how internal and external mechanisms shift cells from catabolic to anabolic states.",
        question: "A bodybuilder consumes a high-protein meal and engages in intense resistance training to build muscle mass. This physiological state is designed to shift muscle cells into an anabolic state. Which combination of internal factors would be expected to be elevated in the muscle cells to promote protein synthesis?",
        options: { 
            A: "AMP and NADH", 
            B: "Succinyl CoA and citrate", 
            C: "ATP and secreted growth factors", 
            D: "Glucagon and cortisol" 
        },
        correctAnswer: "C",
        rationale: "Anabolism, such as building muscle protein, is an energy-intensive process. Therefore, a high availability of ATP is required. Additionally, external factors like exercise and diet stimulate the release of internal growth factors (like IGF-1) and hormones (like testosterone) that signal the muscle cells to increase protein synthesis.",
        source: "'Internal [factors shifting to anabolic state include] Secreted factors (cytokines, growth factors, hormones), ATP bioavailability.' (Bioenergetics, Page 25)"
    },
    {
        learningObjective: "LO1 (Clinical Significance): Describe the importance of glycolysis in the erythrocyte, including its role in regulating hemoglobin affinity, and structural integrity of the cell.",
        question: "A 22-year-old male presents with chronic fatigue and jaundice. Lab tests reveal hemolytic anemia. A deficiency in an enzyme of the glycolytic pathway is suspected. The inability of his erythrocytes to produce sufficient ATP via glycolysis would most directly lead to which of the following cellular defects?",
        options: { 
            A: "Failure of the Na+/K+-ATPase pump, leading to osmotic lysis", 
            B: "Inability to synthesize 2,3-bisphosphoglycerate (2,3-BPG)", 
            C: "Oxidative damage due to insufficient NADPH", 
            D: "Decreased hemoglobin affinity for oxygen" 
        },
        correctAnswer: "A",
        rationale: "Erythrocytes are entirely dependent on glycolysis for ATP production. ATP is crucial for maintaining the function of ion pumps, such as the Na+/K+-ATPase. Failure of this pump leads to an influx of Na+ and water, causing the cell to swell and become a rigid echinocyte, which is then destroyed by the spleen (extravascular hemolysis), resulting in hemolytic anemia.",
        source: "'Defective glycolysis can cause hemolytic anemia... Reduced deformability of RBC causes echinocytes (RBC with thorny projections), leading to extravascular hemolysis...' (Clinical Significance of Metabolic Pathways, Page 7)"
    },
    {
        learningObjective: "LO1 (Clinical Significance): Describe the importance of glycolysis in the erythrocyte, including its role in regulating hemoglobin affinity, and structural integrity of the cell.",
        question: "A person travels to a high-altitude location where the partial pressure of oxygen is low. To adapt, their body increases the synthesis of 2,3-bisphosphoglycerate (2,3-BPG) in erythrocytes. What is the primary function of this increased 2,3-BPG?",
        options: { 
            A: "To increase hemoglobin's affinity for oxygen, improving uptake in the lungs", 
            B: "To decrease hemoglobin's affinity for oxygen, enhancing delivery to tissues", 
            C: "To provide an alternative source of ATP for the erythrocyte", 
            D: "To protect the erythrocyte from oxidative damage" 
        },
        correctAnswer: "B",
        rationale: "2,3-BPG is a negative allosteric regulator of hemoglobin. It binds to deoxyhemoglobin and stabilizes the T (tense) state, which has a lower affinity for oxygen. By decreasing hemoglobin's oxygen affinity, 2,3-BPG facilitates the release of oxygen from hemoglobin to the peripheral tissues, which is crucial for adaptation to high altitude or conditions of hypoxia.",
        source: "'Erythrocyte DPG helps hemoglobin deliver oxygen to tissues.' The graph on the same page shows that 'More DPG' shifts the oxygen-hemoglobin dissociation curve to the right, indicating reduced affinity and enhanced O2 release. (Clinical Significance of Metabolic Pathways, Page 8)"
    },
    {
        learningObjective: "LO1 (Clinical Significance): Describe the importance of glycolysis in the erythrocyte, including its role in regulating hemoglobin affinity, and structural integrity of the cell.",
        question: "A newborn is diagnosed with a severe deficiency in hexokinase within their erythrocytes. This deficiency leads to a left shift in the hemoglobin-oxygen dissociation curve. This shift is most likely caused by a decreased concentration of which glycolytic intermediate?",
        options: {

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                // Use innerHTML to correctly render any potential HTML tags in questions
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;

                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;

                    const labelText = document.createElement('span');
                    labelText.innerHTML = ` ${optionKey}. ${qData.options[optionKey]}`;
                    
                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.addEventListener('click', () => checkAnswer(index));
                buttonContainer.appendChild(checkButton);
                
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');
            const feedbackDiv = questionBlockElement.querySelector('.feedback');

            if (!selectedRadioButton) {
                 feedbackDiv.innerHTML = `<span class="feedback-status">Please select an answer.</span>`;
                 feedbackDiv.className = 'feedback incorrect'; // Use incorrect styling for the alert
                return;
            }

            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';

            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                 feedbackHTML = `<span class="feedback-status">Incorrect.</span> The correct answer is ${qData.correctAnswer}.`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });

    </script>
